<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiedzoidowo</title>
    <meta name="description" content="Wiedzoidowo – quiz wiedzy na Androida.">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f7f3ff, #eef6ff);
            color: #2c2450;
            padding: 24px;
        }

        .card {
            max-width: 680px;
            width: 100%;
            background: white;
            border-radius: 28px;
            padding: 48px 36px;
            text-align: center;
            box-shadow: 0 16px 50px rgba(77, 53, 130, 0.12);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 42px;
            color: #7c5ce6;
        }

        p {
            line-height: 1.6;
            color: #625b78;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #7c5ce6;
            font-weight: 700;
            text-decoration: none;
        }

        .footer {
            margin-top: 36px;
            font-size: 14px;
            color: #9790a8;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Wiedzoidowo</h1>

        <p>
            Quiz wiedzy na Androida. Sprawdź, ile wiesz,
            pobijaj rekordy i podejmuj codzienne wyzwania.
        </p>

        <a href="/privacy/">Polityka prywatności</a>

        <div class="footer">
            © 2026 Wendorfina Studio
        </div>
    </main>
</body>
</html>
